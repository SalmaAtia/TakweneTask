<header class="header">
  <a routerLink="/" class="brand">Track Management</a>
  @if (auth.isLoggedIn()) {
    <button type="button" class="session" (click)="auth.logout()">Log out</button>
  } @else {
    <a class="session" routerLink="/login" [queryParams]="{ returnUrl: router.url }">Log in</a>
  }
</header>

@if (errors.message(); as message) {
  <div class="error-banner" role="alert">
    <span>{{ message }}</span>
    <button type="button" (click)="errors.clear()" aria-label="Dismiss error">&times;</button>
  </div>
}

<main class="content">
  <router-outlet />
</main>
